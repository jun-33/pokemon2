<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 탐험 RPG</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #cfe8b5;
    color: #30291d;
}

button {
    font-family: inherit;
}

#game {
    min-height: 100vh;
}

/* =========================
   상단
========================= */

.top {
    background: #fff4bd;
    border-bottom: 4px solid #b58d36;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.title {
    font-size: 25px;
    font-weight: bold;
    color: #684b12;
}

.stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.stat {
    background: white;
    border: 2px solid #dfbd5b;
    border-radius: 12px;
    padding: 7px 11px;
    font-weight: bold;
}

/* =========================
   전체 화면
========================= */

.main {
    width: 96%;
    max-width: 1100px;
    margin: auto;
    padding: 18px 0 40px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* =========================
   시작 화면
========================= */

.start-card {
    max-width: 700px;
    margin: 50px auto;
    background: #fffdf0;
    border: 4px solid #e3bd4e;
    border-radius: 30px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 25px #806b3030;
}

.start-card h1 {
    font-size: 42px;
    color: #76500f;
}

.start-pokemon {
    font-size: 110px;
    margin: 15px;
}

.start-card p {
    font-size: 19px;
    line-height: 1.7;
}

.start-button {
    border: 0;
    border-radius: 15px;
    background: #e5a82e;
    color: white;
    padding: 17px 35px;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   맵
========================= */

.map-card {
    background: #e9c878;
    border: 5px solid #876b30;
    border-radius: 25px;
    padding: 12px;
    max-width: 760px;
    margin: auto;
}

.map {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 2px;
    background: #719450;
    padding: 5px;
    border-radius: 15px;
}

.tile {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-size: clamp(14px, 3vw, 27px);
    cursor: pointer;
    user-select: none;
}

.grass {
    background: #91bd61;
}

.path {
    background: #d8bd79;
}

.water {
    background: #72b6d8;
}

.tree {
    background: #4f854d;
}

.house {
    background: #d7835e;
}

.center {
    background: #e8d28c;
}

.player {
    background: #ffe47d;
    box-shadow: inset 0 0 0 3px #e69c23;
}

.map-info {
    text-align: center;
    background: #fff9dd;
    margin-top: 10px;
    padding: 10px;
    border-radius: 12px;
    font-weight: bold;
}

/* =========================
   조작
========================= */

.controls {
    max-width: 350px;
    margin: 15px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.control {
    border: 0;
    background: #fff2b7;
    border: 2px solid #d5ad43;
    border-radius: 12px;
    padding: 13px;
    font-size: 23px;
    cursor: pointer;
}

.control:hover {
    background: #ffe188;
}

.blank {
    visibility: hidden;
}

/* =========================
   하단 버튼
========================= */

.menu {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0;
}

.menu button,
.action-button {
    border: 0;
    border-radius: 12px;
    padding: 12px 17px;
    background: #fff1ae;
    border: 2px solid #d5ae45;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.menu button:hover,
.action-button:hover {
    background: #ffdc68;
}

/* =========================
   배틀
========================= */

.battle-card {
    max-width: 800px;
    margin: auto;
    background: #eff4dc;
    border: 5px solid #739257;
    border-radius: 25px;
    padding: 20px;
}

.battle-field {
    background: linear-gradient(#bfe0a0 0 65%, #8eb86c 65%);
    border-radius: 20px;
    padding: 20px;
    min-height: 470px;
}

.enemy {
    text-align: right;
}

.player {
    text-align: left;
}

.battle-pokemon {
    font-size: 105px;
    line-height: 1;
    margin: 5px;
}

.enemy .battle-pokemon {
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

.poke-info {
    display: inline-block;
    min-width: 250px;
    background: #fffdf0;
    border: 3px solid #665838;
    border-radius: 14px;
    padding: 10px;
    text-align: left;
}

.poke-name {
    font-size: 21px;
    font-weight: bold;
}

.hp {
    margin-top: 6px;
    height: 17px;
    background: #ccc;
    border-radius: 20px;
    overflow: hidden;
}

.hp-fill {
    height: 100%;
    background: #54a93d;
    transition: width .35s;
}

.battle-message {
    background: white;
    border: 3px solid #c7a84e;
    border-radius: 15px;
    padding: 14px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    min-height: 55px;
    margin: 12px 0;
}

.battle-actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.battle-actions button {
    padding: 16px;
    border: 0;
    border-radius: 13px;
    background: #ffd65e;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    border-bottom: 4px solid #c39b34;
}

.battle-actions button:hover {
    background: #ffc933;
}

.battle-actions button:disabled {
    background: #bbb;
    cursor: not-allowed;
    border: 0;
}

/* =========================
   도감
========================= */

.panel {
    max-width: 900px;
    margin: auto;
    background: #fffdf0;
    border: 4px solid #dfbd55;
    border-radius: 25px;
    padding: 25px;
}

.panel h2 {
    font-size: 32px;
    text-align: center;
    color: #704e12;
}

.dex-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.dex {
    background: #fff4c4;
    border: 2px solid #e0bd54;
    border-radius: 15px;
    padding: 12px 5px;
    text-align: center;
}

.dex.locked {
    filter: grayscale(1);
    opacity: .45;
}

.dex-emoji {
    font-size: 48px;
}

.dex-name {
    font-weight: bold;
}

.dex-number {
    color: #8d7952;
    font-size: 13px;
}

/* =========================
   포켓몬 목록
========================= */

.party-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.party-card {
    background: #fff4c4;
    border: 3px solid #e0bd54;
    border-radius: 16px;
    padding: 15px;
}

.party-emoji {
    font-size: 60px;
}

/* =========================
   메시지
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    background: #4d3b1e;
    color: white;
    padding: 14px 22px;
    border-radius: 15px;
    font-size: 17px;
    display: none;
    z-index: 20;
}

/* =========================
   반응형
========================= */

@media(max-width:600px) {

    .title {
        font-size: 20px;
    }

    .stats {
        font-size: 13px;
    }

    .start-card h1 {
        font-size: 32px;
    }

    .start-pokemon {
        font-size: 80px;
    }

    .map {
        grid-template-columns: repeat(15, 1fr);
    }

    .battle-pokemon {
        font-size: 75px;
    }

    .dex-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .party-grid {
        grid-template-columns: 1fr;
    }

    .battle-actions {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

                </p>

                <p>

                    🔴 HP가 낮을수록 포획 성공 확률이 올라갑니다.<br>
                    🏠 마을에서는 포켓몬을 무료로 회복할 수 있습니다.

                </button>

                <button onclick="saveGame()">

            </div>

        </section>


        <!-- =====================
             배틀 화면
        ====================== -->

        <section class="screen" id="battleScreen">

            <div class="battle-card">

                <div class="battle-field">

                    <div class="enemy">

                        <div class="poke-info">

                            <div class="poke-name">
                                야생 <span id="enemyName"></span>
                            </div>

                            HP:
                            <span id="enemyHpText"></span>

                            <div class="hp">
                                <div class="hp-fill"
                                     id="enemyHpBar"></div>
                            </div>

                        </div>

                        <div class="battle-pokemon"
                             id="enemyEmoji"></div>

                    </div>


                    <div class="battle-message"
                         id="battleMessage">
                    </div>


                    <div class="player">

                        <div class="battle-pokemon"
                             id="battlePlayerEmoji"></div>

                        <div class="poke-info">

                            <div class="poke-name">
                                🔵 <span id="battlePlayerName"></span>
                                Lv.<span id="battlePlayerLevel"></span>
                            </div>

                            HP:
                            <span id="playerHpText"></span>

                            <div class="hp">
                                <div class="hp-fill"
                                     id="playerHpBar"></div>
                            </div>

                        </div>

                    </div>

                </div>


                <div class="battle-actions">

                    <button onclick="battleAttack()">
                        ⚔️ 공격
                    </button>

                    <button onclick="throwBall()">
                        🔴 포켓몬볼
                    </button>

                    <button onclick="usePotion()">
                        💊 회복약
                    </button>

                    <button onclick="runAway()">
                        🏃 도망가기
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================
             파티
        ====================== -->

        <section class="screen" id="partyScreen">

            <div class="panel">

                <h2>🎒 내 포켓몬</h2>

                <div class="party-grid"
                     id="partyGrid">
                </div>

                <div class="menu">
                    <button onclick="showScreen('exploreScreen')">
                        🗺️ 탐험으로 돌아가기

                </div>

            </div>

        </section>


        <!-- =====================
             도감
        ====================== -->

        <section class="screen" id="dexScreen">

            <div class="panel">

                        🗺️ 탐험으로 돌아가기
                    </button>
                </div>

            </div>

        </section>

    </div>

</div>

/* ==================================================

/*
0 = 길
1 = 풀
2 = 나무
3 = 물
4 = 집
*/

const mapData = [

    [2,2,2,2,2,2,2,2,2,2,2,2,2,2,2],

    [2,1,1,1,0,0,1,1,1,2,1,1,1,1,2],

];

/* ==================================================
   게임 시작
================================================== */

function startGame() {

    showScreen("exploreScreen");

    drawMap();

    updateUI();

    showToast("🌿 모험이 시작되었습니다!");

}


/* ==================================================
   화면 전환
================================================== */

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(function(screen) {

        screen.classList.remove("active");

    });

    document.getElementById(id).classList.add("active");

}


/* ==================================================
   맵 그리기
================================================== */

function drawMap() {

    const map = document.getElementById("map");

    map.innerHTML = "";


    for(let y = 0; y < mapData.length; y++) {

        for(let x = 0; x < mapData[y].length; x++) {

            const tile = document.createElement("div");

            tile.className = "tile";


            let type = mapData[y][x];


            if(type === 0) {

                tile.classList.add("path");
                tile.textContent = "·";

            }

            else if(type === 1) {

                tile.classList.add("grass");
                tile.textContent = "🌿";

            }

            else if(type === 2) {

                tile.classList.add("tree");
                tile.textContent = "🌲";

            }

            else if(type === 3) {

                tile.classList.add("water");
                tile.textContent = "🌊";

            }

            else if(type === 4) {

                tile.classList.add("house");
                tile.textContent = "🏠";

            }


            if(x === playerX && y === playerY) {

                tile.className = "tile player";
                tile.textContent = "🧑";

            }


            map.appendChild(tile);

        }

    }

}

/* ==================================================
   배틀 화면
================================================== */

function updateBattle() {

    document.getElementById("enemyName").textContent =
        currentEnemy.name;

    document.getElementById("enemyEmoji").textContent =
        currentEnemy.emoji;


    document.getElementById("battlePlayerName").textContent =
        playerPokemon.name;

    document.getElementById("battlePlayerLevel").textContent =
        playerLevel;

    document.getElementById("battlePlayerEmoji").textContent =
        playerPokemon.emoji;


    document.getElementById("enemyHpText").textContent =
        enemyHp + " / " + currentEnemy.maxHp;

    document.getElementById("playerHpText").textContent =
        playerHp + " / " + playerMaxHp;


    document.getElementById("enemyHpBar").style.width =
        (enemyHp / currentEnemy.maxHp * 100) + "%";

    document.getElementById("playerHpBar").style.width =
        (playerHp / playerMaxHp * 100) + "%";

}


/* ==================================================
   공격
================================================== */

function battleAttack() {

    if(!inBattle) return;


    let damage =
        randomNumber(12, 20) +
        playerLevel;


    enemyHp -= damage;


    if(enemyHp < 0) {
        enemyHp = 0;
    }


    updateBattle();


    document.getElementById("battleMessage").textContent =
        "⚔️ " +
        playerPokemon.name +
        "의 공격! " +
        damage +
        "의 데미지를 입혔습니다!";


    /*
    쓰러짐
    */

    if(enemyHp <= 0) {

        winBattle();

        return;
    }


    disableBattleButtons();

    setTimeout(enemyAttack, 700);

}


/* ==================================================
   적 공격
================================================== */

function enemyAttack() {

    if(!inBattle) return;


    let damage =
        randomNumber(
            Math.max(5, currentEnemy.attack - 5),
            currentEnemy.attack + 5
        );


    playerHp -= damage;


    if(playerHp < 0) {
        playerHp = 0;
    }


    updateBattle();

    updateUI();


    document.getElementById("battleMessage").textContent =
        "💥 야생 " +
        currentEnemy.name +
        "의 공격! " +
        damage +
        "의 데미지를 받았습니다!";


    if(playerHp <= 0) {

        loseBattle();

        return;
    }


    enableBattleButtons();

}

   포켓몬볼

            "🎉 포획 성공! " +
            currentEnemy.name +

function endBattle() {

    inBattle = false;

    currentEnemy = null;

    /*
    다음 배틀을 위해 버튼 상태 초기화
    */

    enableBattleButtons();

    showScreen("exploreScreen");

    drawMap();

    updateUI();
}
function usePotion() {

    if(!inBattle) return;


    if(potions <= 0) {

        showToast("💊 회복약이 없습니다!");

        return;
    }


    if(playerHp >= playerMaxHp) {

        showToast("❤️ 이미 체력이 가득합니다!");

        return;
    }


    potions--;


    let heal =
        randomNumber(20, 35);


    playerHp += heal;


    if(playerHp > playerMaxHp) {

        playerHp = playerMaxHp;

    }


    updateBattle();

    updateUI();


    document.getElementById("battleMessage").textContent =
        "💚 회복약을 사용해 " +
        heal +
        "만큼 회복했습니다!";


    disableBattleButtons();

    setTimeout(enemyAttack, 700);

}


/* ==================================================
   도망
================================================== */

function runAway() {

    if(!inBattle) return;


    /*
    80% 확률
    */

    if(Math.random() < 0.8) {

        document.getElementById("battleMessage").textContent =
            "🏃 무사히 도망쳤습니다!";


        setTimeout(function() {

            endBattle();

        }, 700);

    }

    else {

        document.getElementById("battleMessage").textContent =
            "😱 도망치지 못했습니다!";

        disableBattleButtons();

        setTimeout(enemyAttack, 700);

    }

}


/* ==================================================
   배틀 승리
================================================== */

function winBattle() {

    let gainedExp =
        randomNumber(20, 35);


    let gainedCoins =
        randomNumber(5, 15);


    coins += gainedCoins;


    addExp(gainedExp);


    document.getElementById("battleMessage").textContent =
        "🏆 승리! 경험치 +" +
        gainedExp +
        " / 💰 코인 +" +
        gainedCoins;


    disableBattleButtons();


    setTimeout(function() {

        endBattle();

    }, 1200);

}


/* ==================================================
   배틀 패배
================================================== */

function loseBattle() {

    document.getElementById("battleMessage").textContent =
        "💫 " +
        playerPokemon.name +
        "이(가) 쓰러졌습니다...";


    disableBattleButtons();


    setTimeout(function() {

        healPlayer();

        endBattle();

        showToast("🏠 포켓몬 센터에서 회복했습니다.");

    }, 1300);

}


/* ==================================================
   배틀 종료
================================================== */

function endBattle() {

    inBattle = false;

    currentEnemy = null;

    showScreen("exploreScreen");

    drawMap();

    updateUI();

}


/* ==================================================
   경험치 / 레벨업
================================================== */

function addExp(amount) {

    exp += amount;


    /*
    레벨업에 필요한 경험치
    */

    let needed =
        playerLevel * 40;


    while(exp >= needed) {

        exp -= needed;

        playerLevel++;

        playerMaxHp += 10;

        playerHp = playerMaxHp;


        showToast(
            "🎉 레벨 업! Lv." +
            playerLevel
        );


        needed =
            playerLevel * 40;

    }

}


/* ==================================================
   회복
================================================== */

function healPlayer() {

    playerHp = playerMaxHp;

    updateUI();

}


/* ==================================================
   파티 보기
================================================== */

function showParty() {

    const grid =
        document.getElementById("partyGrid");

    grid.innerHTML = "";


    caught.forEach(function(name) {

        const data =
            pokemonList.find(function(p) {
                return p.name === name;
            });


        const card =
            document.createElement("div");

        card.className = "party-card";


        card.innerHTML =
            `
            <div class="party-emoji">${data.emoji}</div>
            <h3>${data.name}</h3>
            <p>잡은 포켓몬</p>
            `;


        grid.appendChild(card);

    });


    showScreen("partyScreen");

}


/* ==================================================
   도감
================================================== */

function showDex() {

    const grid =
        document.getElementById("dexGrid");

    grid.innerHTML = "";


    pokemonList.forEach(function(pokemon, index) {

        const isCaught =
            caught.includes(pokemon.name);


        const card =
            document.createElement("div");


        card.className =
            "dex " +
            (isCaught ? "" : "locked");


        card.innerHTML =
            `
            <div class="dex-number">
                No.${String(index + 1).padStart(2,"0")}
            </div>

            <div class="dex-emoji">
                ${isCaught ? pokemon.emoji : "❓"}
            </div>

            <div class="dex-name">
                ${isCaught ? pokemon.name : "???"}
            </div>

            <small>
                ${isCaught ? pokemon.rarity : "미발견"}
            </small>
            `;


        grid.appendChild(card);

    });


    showScreen("dexScreen");

}


/* ==================================================
   UI 업데이트
================================================== */

function updateUI() {

    document.getElementById("level").textContent =
        playerLevel;

    document.getElementById("playerHpTop").textContent =
        playerHp;

    document.getElementById("ballCount").textContent =
        balls;

    document.getElementById("coins").textContent =
        coins;

}


/* ==================================================
   배틀 버튼 제어
================================================== */

function disableBattleButtons() {

    document.querySelectorAll(
        ".battle-actions button"
    ).forEach(function(button) {

        button.disabled = true;

    });

}


function enableBattleButtons() {

    document.querySelectorAll(
        ".battle-actions button"
    ).forEach(function(button) {

        button.disabled = false;

    });

}


/* ==================================================
   랜덤 숫자
================================================== */

function randomNumber(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* ==================================================
   알림
================================================== */

let toastTimer;

function showToast(text) {

    const toast =
        document.getElementById("toast");


    toast.textContent = text;

    toast.style.display = "block";


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(function() {

            toast.style.display = "none";

        }, 1800);

}


/* ==================================================
   저장
================================================== */

function saveGame() {

    const saveData = {

        playerLevel,
        playerHp,
        playerMaxHp,
        exp,
        coins,
        balls,
        potions,
        caught,
        playerX,
        playerY

    };


    localStorage.setItem(
        "pokemonRPGSave",
        JSON.stringify(saveData)
    );


    showToast("💾 게임이 저장되었습니다!");

}


/* ==================================================
   불러오기
================================================== */

function loadGame() {

    const saved =
        localStorage.getItem("pokemonRPGSave");


    if(!saved) {

        return false;

    }


    try {

        const data =
            JSON.parse(saved);


        playerLevel =
            data.playerLevel;

        playerHp =
            data.playerHp;

        playerMaxHp =
            data.playerMaxHp;

        exp =
            data.exp;

        coins =
            data.coins;

        balls =
            data.balls;

        potions =
            data.potions;

        caught =
            data.caught;

        playerX =
            data.playerX;

        playerY =
            data.playerY;


        return true;

    }

    catch(error) {

        return false;

    }

}


/* ==================================================
   키보드 조작
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if(!document
            .getElementById("exploreScreen")
            .classList.contains("active")) {

            return;

        }


        if(event.key === "ArrowUp") {

            move(0,-1);

        }

        else if(event.key === "ArrowDown") {

            move(0,1);

        }

        else if(event.key === "ArrowLeft") {

            move(-1,0);

        }

        else if(event.key === "ArrowRight") {

            move(1,0);

        }

    }
);


/* ==================================================
   게임 자동 저장
================================================== */

setInterval(function() {

    if(
        document
        .getElementById("exploreScreen")
        .classList.contains("active")
    ) {

        saveGame();

    }

}, 30000);


/* ==================================================
   페이지 시작
================================================== */

const loaded =
    loadGame();


if(loaded) {

    /*
    저장 데이터가 있으면
    바로 탐험 화면을 보여준다.
    */

    showScreen("exploreScreen");

    drawMap();

    updateUI();

    showToast("💾 저장된 게임을 불러왔습니다!");

}
